name: duo
description: "A private, playful mobile app for couples. Two people. One little world."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.2

  # Backend & Supabase
  supabase_flutter: ^2.5.6

  # Offline Storage & Utilities
  hive_flutter: ^1.1.0
  intl: ^0.20.3
  uuid: ^4.4.0
  share_plus: ^9.0.0
  cached_network_image: ^3.3.1
  connectivity_plus: ^6.0.3

  # UI & Animations
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/icons/
    - assets/images/
